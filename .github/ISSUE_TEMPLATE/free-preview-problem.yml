name: 练习运行问题
description: 报告免费预览或同一练习包的启动、保存或恢复问题；不要提交交易资料、个人资料或付费文件。
title: "[运行问题] "
body:
  - type: markdown
    attributes:
      value: |
        这是公开问题区。不要提交订单号、付款截图、邮箱、账号、客户资料、密码、验证码、API密钥或含个人信息的完整文件路径。
        本表单仅接收一般运行问题；真实交易和退款请按实际订单流程及商品页公布的商用入口处理。
  - type: dropdown
    id: stage
    attributes:
      label: 卡在哪一步？
      options:
        - 下载或解压免费样例
        - 让AI助手读取SKILL.md
        - 开始案例
        - 保存我的回答
        - 恢复已有记录
        - 获得或保存反馈
        - 其他练习运行问题
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: AI助手名称和操作系统（可选）
      description: 只写产品名称与系统类别即可，不要写账号、设备编号或用户名。
      placeholder: 例如：桌面AI助手，macOS
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 你做了哪些操作？
      description: 用虚构案例说明能重现问题的最少步骤，不要粘贴真实客户对话。
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 实际发生了什么？
      description: 可贴已去除个人信息的错误提示。把个人目录、令牌及账号信息删掉。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你原本期待什么？
      description: 只描述期望行为，不需上传练习记录或支付材料。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已删除交易信息、个人资料、客户资料、密码及密钥。
          required: true
